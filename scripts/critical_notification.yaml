blueprint:
  name: Critical notification
  description: >
    Send a maximum-volume critical notification through one Companion App
    notification action.
  domain: script
  homeassistant:
    min_version: "2024.8.0"

  input:
    companion_app_device:
      name: Companion App device
      description: >
        Device that should receive the critical notification.
      selector:
        device:
          filter:
            - integration: mobile_app

fields:
  message:
    name: Message
    description: Notification message.
    required: true
    selector:
      text:
        multiline: true

  title:
    name: Title
    description: Notification title.
    required: false
    default: Critical
    selector:
      text:

sequence:
  - alias: Normalize notification details
    variables:
      notification_message: >
        {{ message | default('', true) | string | trim }}
      notification_title: >
        {{ title | default('Critical', true) | string | trim }}

  - alias: Validate notification
    if:
      - condition: template
        value_template: >
          {{ notification_message == '' }}
    then:
      - stop: A notification message is required.
        error: true

  - alias: Send critical notification
    device_id: !input companion_app_device
    domain: mobile_app
    type: notify
    title: "{{ notification_title }}"
    message: "{{ notification_message }}"
    data:
      push:
        sound:
          name: default
          critical: 1
          volume: 1.0

mode: parallel
max: 10

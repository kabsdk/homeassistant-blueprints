blueprint:
  name: Critical notification
  description: >
    Send a maximum-volume critical notification to a Companion App device
    selected each time the script is called.
  domain: script
  homeassistant:
    min_version: "2024.8.0"

fields:
  target:
    name: Target
    description: Companion App device that should receive the notification.
    required: true
    selector:
      device:
        filter:
          - integration: mobile_app

  title:
    name: Title
    description: Notification title.
    required: false
    default: Critical alert
    selector:
      text:

  message:
    name: Message
    description: Notification message.
    required: true
    selector:
      text:
        multiline: true

sequence:
  - alias: Resolve notification
    variables:
      target_device: "{{ target | default('', true) }}"
      notification_title: >
        {{ title | default('Critical alert', true) | string | trim }}
      notification_message: >
        {{ message | default('', true) | string | trim }}
      notification_action: >
        {% if target_device != '' %}
          notify.mobile_app_{{ device_attr(target_device, 'name') | slugify }}
        {% else %}
          {{ '' }}
        {% endif %}

  - alias: Validate notification
    if:
      - condition: template
        value_template: >
          {{
            target_device == ''
            or device_attr(target_device, 'name') is none
            or notification_message == ''
          }}
    then:
      - stop: A Companion App target and non-empty message are required.
        error: true

  - alias: Send critical notification
    action: "{{ notification_action }}"
    data:
      title: "{{ notification_title }}"
      message: "{{ notification_message }}"
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1.0

mode: parallel
max: 10

blueprint:
  name: Activity-controlled lights
  description: >
    Turn one or more lights on while a room is active, then turn them off after
    every activity entity has become inactive for a configurable period.

    Activity entities may turn the lights on. Optional hold entities can keep
    already-on lights on, but never turn them on by themselves. By default this
    automation takes ownership of its selected lights whenever activity turns
    them on, even if someone had already switched them on manually.

    Lights that are off receive the selected JSON lighting profile when turned
    on. Lights that are already on are adopted without a service call, so their
    brightness and color are left unchanged.

    The lockout helper blocks every controller action, including delayed
    turn-off. Optional activation conditions restrict only when activity is
    allowed to turn the lights on (for example by illuminance, time, or
    presence). Startup and automation-reload recovery prevents an interrupted
    ownership timer from leaving lights stranded on.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"

  input:
    required:
      name: Lights and activity
      icon: mdi:motion-sensor
      input:
        activity_entities:
          name: Activity entities
          description: >
            One or more entities whose active state should turn on the lights.
            Motion and occupancy binary sensors are typical, but any entity
            with the configured active state can be used.
          selector:
            entity:
              multiple: true

        light_entities:
          name: Lights
          description: >
            The lights controlled as one set. When activity is accepted, all
            selected lights become owned by this automation and are turned off
            together after inactivity.
          selector:
            entity:
              filter:
                - domain: light
              multiple: true

        lighting_profile:
          name: Lighting profile
          description: >
            The same input_text JSON lighting profile used by the Philips Hue
            dimmer blueprint. It must contain integer brightness (1-255) and
            color_temp_kelvin (1000-10000). The profile is applied only to
            selected lights that are currently off.
          selector:
            entity:
              filter:
                - domain: input_text

        lockout_boolean:
          name: Activity lockout
          description: >
            The same input_boolean lockout used by the Philips Hue dimmer
            blueprint. While it is on, this controller does nothing: it cannot
            turn lights on, change them, or turn them off.
          selector:
            entity:
              filter:
                - domain: input_boolean

    behavior:
      name: Activity behavior
      icon: mdi:timer-outline
      input:
        hold_entities:
          name: Keep-on entities
          description: >
            Optional entities that count as activity only while the selected
            lights are already on. Use these for sources such as a bed
            occupancy sensor, media player helper, or another room-state
            helper that should keep lights on without switching them on.
          default: []
          selector:
            entity:
              multiple: true

        active_state:
          name: Active state
          description: >
            State considered active for both activity and keep-on entities.
            The default works with binary sensors and input booleans.
          default: "on"
          selector:
            text:

        inactivity_delay:
          name: Inactivity delay
          description: >
            How long every activity and keep-on entity must remain inactive
            before the lights are turned off.
          default:
            minutes: 5
          selector:
            duration:

        activation_conditions:
          name: Activation conditions
          description: >
            Optional Home Assistant conditions evaluated only before an
            activity entity turns on the lights. Leave empty to allow
            activation at all times. Multiple conditions must all pass.
          default: []
          selector:
            condition:

    advanced:
      name: Light behavior
      icon: mdi:lightbulb-cog-outline
      collapsed: true
      input:
        turn_on_transition:
          name: Turn-on transition
          default: 0
          selector:
            number:
              min: 0
              max: 30
              step: 0.1
              unit_of_measurement: s
              mode: box

        turn_off_transition:
          name: Turn-off transition
          default: 0
          selector:
            number:
              min: 0
              max: 30
              step: 0.1
              unit_of_measurement: s
              mode: box

variables:
  activity_entity_ids: !input activity_entities
  hold_entity_ids: !input hold_entities
  light_entity_ids: !input light_entities
  lighting_profile_entity: !input lighting_profile
  lockout_boolean_entity: !input lockout_boolean
  active_state_value: !input active_state

triggers:
  - trigger: state
    entity_id: !input activity_entities
    to: !input active_state
    id: activate

  - trigger: state
    entity_id: !input hold_entities
    to: !input active_state
    id: hold

  # Reloading automations cancels an in-progress wait or delay. Reconcile any
  # lights that remain on so ownership is not silently lost.
  - trigger: homeassistant
    event: start
    id: reconcile

  - trigger: event
    event_type: automation_reloaded
    id: reconcile

  # Entering lockout restarts and immediately stops any running ownership timer.
  # Leaving lockout reconciles already-on lights through the normal action path.
  - trigger: state
    entity_id: !input lockout_boolean
    id: lockout_changed

actions:
  - condition: template
    value_template: "{{ is_state(lockout_boolean_entity, 'off') }}"

  - choose:
      - conditions:
          - condition: trigger
            id: activate
        sequence:
          # Optional conditions apply only to activation. The dedicated lockout
          # is enforced separately across the entire controller lifecycle.
          - variables:
              lights_that_are_off: >-
                {{
                  expand(light_entity_ids)
                  | selectattr('state', 'eq', 'off')
                  | map(attribute='entity_id')
                  | list
                }}

          - choose:
              # Adopting already-on lights must not send light.turn_on: doing so
              # can reapply a profile or restore an old brightness attribute.
              - conditions:
                  - condition: template
                    value_template: "{{ lights_that_are_off | count == 0 }}"
                sequence:
                  - variables:
                      ownership_adopted_without_light_command: true

              - conditions: !input activation_conditions
                sequence:
                  - variables:
                      profile: >-
                        {{
                          states(lighting_profile_entity)
                          | from_json(default={})
                        }}

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {% if profile is mapping %}
                                {% set brightness = profile.get("brightness") %}
                                {% set kelvin = profile.get("color_temp_kelvin") %}
                                {{
                                  brightness is integer
                                  and brightness is not boolean
                                  and 1 <= brightness <= 255
                                  and kelvin is integer
                                  and kelvin is not boolean
                                  and 1000 <= kelvin <= 10000
                                }}
                              {% else %}
                                false
                              {% endif %}
                        sequence:
                          # Apply the profile only to lights that were off when
                          # activity arrived. Already-on lights are left exactly
                          # as they are, including their current brightness.
                          - action: light.turn_on
                            target:
                              entity_id: "{{ lights_that_are_off }}"
                            data:
                              brightness: "{{ profile.get('brightness') | int }}"
                              color_temp_kelvin: >-
                                {{ profile.get('color_temp_kelvin') | int }}
                              transition: !input turn_on_transition
                    default:
                      - stop: >-
                          Invalid lighting profile in
                          {{ lighting_profile_entity }}. Expected integer
                          brightness 1-255 and color_temp_kelvin 1000-10000.
                        error: true
            default:
              # A failed activation condition must not abandon an existing
              # ownership timer. Continue only if there is a light to manage.
              - condition: template
                value_template: >-
                  {{
                    expand(light_entity_ids)
                    | selectattr('state', 'eq', 'on')
                    | list
                    | count > 0
                  }}

      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: hold
              - condition: trigger
                id: reconcile
              - condition: trigger
                id: lockout_changed
        sequence:
          # Keep-on sources and recovery events may adopt lights that are on,
          # but must never illuminate a dark room or alter its light profile.
          - condition: template
            value_template: >-
              {{
                expand(light_entity_ids)
                | selectattr('state', 'eq', 'on')
                | list
                | count > 0
              }}
    default:
      - stop: Unsupported activity trigger

  # Waiting on aggregate state avoids the common multiple-sensor bug where the
  # first sensor to clear starts the timer while another sensor is still active.
  - wait_template: >-
      {{
        expand(activity_entity_ids + hold_entity_ids)
        | selectattr('state', 'eq', active_state_value)
        | list
        | count == 0
      }}

  - delay: !input inactivity_delay

  # A state change normally restarts the automation. Rechecking here also makes
  # the turn-off safe across fast state changes near the end of the delay.
  - condition: template
    value_template: >-
      {{
        expand(activity_entity_ids + hold_entity_ids)
        | selectattr('state', 'eq', active_state_value)
        | list
        | count == 0
      }}

  # Lockout may have changed while the delay was running. This second check is
  # intentional defensive protection against races at the end of the timer.
  - condition: template
    value_template: "{{ is_state(lockout_boolean_entity, 'off') }}"

  - action: light.turn_off
    target:
      entity_id: !input light_entities
    data:
      transition: !input turn_off_transition

# Each new active event replaces the current wait/delay and recomputes the
# aggregate room state, giving the blueprint one predictable ownership timer.
mode: restart
max_exceeded: silent
